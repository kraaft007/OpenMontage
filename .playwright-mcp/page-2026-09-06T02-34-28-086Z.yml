            - generic [ref=f1e172]: "SUPERSEDES d-012, which was proposed-only. User approved. One material correction to what d-012 claimed: scene extension is NOT exposed on fal — it is a multi-turn previous_interaction_id workflow on Google's Interactions API and therefore belongs to gemini_omni_video, which now defaults to the 1.1 model. fal contributes first-and-last-frame interpolation via end_image_url, up to three reference videos of three seconds each, resolution tiers, and a 360p draft at $0.03/s. Also fixed a fourth wrong in-repo price constant: the flat $0.13/s over-reported 720p by 30 percent."
