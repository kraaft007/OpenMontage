            - generic [ref=f1e167]: "SUPERSEDES d-014. The user asked why a gateway was being used when a direct key exists, and the question was right. The fal recommendation was tool-shaped: fal was where the plumbing had just been written, not the better route. Verified: the direct Interactions API accepts resolution inside response_format with the same four tiers at the same prices, supports <FIRST_FRAME>/<LAST_FRAME> keyframe control, and is the only route offering scene extension. The tool was simply not sending those fields. Still NOT user-approved as a provider choice; the gate remains open."
            - generic [ref=f1e168]: "also considered: Omni 1.1 through the fal gateway · grok_video — $0.56 per 8s 720p"
          - generic [ref=f1e169]:
