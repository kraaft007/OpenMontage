            - generic [ref=f1e161]: Story and staging for the Spacesuit Bridge piece → A last departure from Earth. Seated in the captain's chair, forward-facing, presses one control, goes to warp. Earth is behind him and he never looks back.
            - generic [ref=f1e162]: "USER-DIRECTED, not agent-recommended. Three consequences bind the rest of the production. First, shot01's staging is superseded — he stands, holds a helmet and faces camera there; the film needs him seated and forward-facing, so that beat is regenerated rather than reused. Second, the reverse angle becomes the key shot: with Earth aft and the subject forward, only a camera in front of him holds his face and the thing he is leaving in one frame, and he is not looking at it. Third, the bridge formation must physically permit Earth to be behind the chair while he faces forward, which reshapes two of the three formations under consideration."
            - generic [ref=f1e163]: "also considered: Departure with Earth visible ahead, watched as it recedes · Standing at a console holding a helmet, as in shot01"
